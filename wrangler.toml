# Cloudflare Workers Configuration
name = "whois"
main = "backend/src/worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Preserve environment variables and secrets set in the Cloudflare dashboard
keep_vars = true

# Serve static assets generated by Next.js (frontend/out)
[assets]
directory = "./frontend/out"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"
